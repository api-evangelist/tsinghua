- aid: tsinghua:datacite-doi
  name: Tsinghua University DataCite DOI Registration and Resolution
  description: >-
    Tsinghua University holds a DataCite membership in its own name — symbol TSINGHUA,
    memberType direct_member, organizationType academicInstitution, joined 2016-09-05, registered
    against the university library — under which 194 DOIs are minted on prefix 10.23650. The
    landing pages resolve to Tsinghua's own host, datacite.lib.tsinghua.edu.cn, so this is an
    institution-operated DOI service rather than a tenancy on a vendor repository platform, which
    is unusual and worth noting for this cohort. Two caveats are load-bearing. The resolution host
    does not answer HTTP from outside China: TCP 443 is open and the TLS handshake completes
    against a valid Let's Encrypt certificate for *.tsinghua.edu.cn, but a GET returns zero bytes
    after 60 seconds, and doi.org redirects into the same dead end — so these DOIs are registered
    but unresolvable from here. And the two repository clients under the membership are
    TSINGHUA.NGAC ("China Geological Survey", 2017) and TSINGHUA.KUKSIK ("test", 2021); the DOI
    content observed is Chinese national geological-survey data curated by Tsinghua, not a general
    institutional research-data repository. Tsinghua registers no repository in re3data at all.
    No contract is saved under this entry — the machine-readable evidence lives in DataCite's own
    API, which is DataCite's contract, not Tsinghua's.
  humanURL: https://lib.tsinghua.edu.cn/en/
  baseURL: https://datacite.lib.tsinghua.edu.cn

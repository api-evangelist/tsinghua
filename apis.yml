- aid: tsinghua:tsinghua-mirror-status-api
  name: Tsinghua University TUNA Open Source Mirror
  description: >-
    The TUNA open-source software mirror is the one surface Tsinghua publishes that behaves like a
    public API. It is operated by TUNA (Tsinghua University TUNA Association), a student
    association, on the university's own registrable domain and infrastructure, and it serves two
    unauthenticated JSON documents. /static/tunasync.json reports the synchronization state of
    every mirrored repository — name, status, upstream source, on-disk size and five timestamps
    per mirror — and drives the site's public status dashboard. /static/status/isoinfo.json is the
    catalog behind the installable-images page: 66 entries across three categories (os, font,
    app), each with a list of named, mirror-relative download paths. Both were verified live on
    2026-08-19. The document shapes come from TUNA's own MIT-licensed software (tunasync,
    mirror-web); no formal specification is published by TUNA, so both OpenAPI descriptions here
    were written from the live responses. Caller beware: the edge returns 403 with an HTML denial
    page to browser-shaped User-Agents while returning 200 to plain tool User-Agents.
  humanURL: https://mirrors.tuna.tsinghua.edu.cn/

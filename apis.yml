aid: tsinghua
name: Tsinghua University
description: >-
  Tsinghua University (清华大学) is a public national research university in Beijing, China, a
  member of the C9 League and the Double First-Class construction programme, and one of the
  highest-ranked universities in Asia. Its programmable footprint is small, real, and almost
  entirely invisible from outside the campus network. Tsinghua operates no developer portal, no
  open data portal and no API key issuance of any kind: api.tsinghua.edu.cn, open.tsinghua.edu.cn
  and data.tsinghua.edu.cn do not resolve. Every system the university runs for its own community
  — the learning platform (learn.tsinghua.edu.cn), course registration (zhjwxk.cic.tsinghua.edu.cn),
  the institutional GitLab (git.tsinghua.edu.cn), Tsinghua Cloud (cloud.tsinghua.edu.cn), the
  information portal and the campus card — terminates at one electronic identity service,
  id.tsinghua.edu.cn, and is unreachable without institutional affiliation.
  What Tsinghua does publish, unauthenticated and machine-readable, is three things, and all three
  are the institution's own rather than a vendor's. First, the TUNA open-source mirror
  (mirrors.tuna.tsinghua.edu.cn), run by the student TUNA association on the university's own
  domain and infrastructure, which serves two live JSON documents: the tunasync synchronization
  status of every mirrored repository, and a catalog of the installable images for 66
  distributions, font collections and applications. Second, and more consequential for a
  university, Tsinghua runs its own Shibboleth Identity Provider at idp.tsinghua.edu.cn and
  publishes SAML 2.0 federation metadata about it — entityID
  https://idp.tsinghua.edu.cn/idp/shibboleth, shibmd:Scope tsinghua.edu.cn — with every
  SingleSignOnService and SingleLogoutService location resolving to a Tsinghua host rather than to
  a federation vendor. Third, the university library holds a DataCite direct membership in its own
  name (symbol TSINGHUA, joined 2016) under which 194 DOIs are registered on prefix 10.23650,
  resolving to datacite.lib.tsinghua.edu.cn.
  Two honest qualifications belong in this description. The DOI landing-page host completes TCP
  and TLS but returns nothing to an HTTP GET after 60 seconds from outside China, so those 194
  DOIs are registered but unresolvable from here. And the mirror's edge answers HTTP 403 to
  requests carrying a desktop-browser User-Agent while answering the same request 200 for a plain
  tool User-Agent — the inverse of the usual bot filter, and enough to lock out any agent that
  spoofs a browser. Notably, Tsinghua holds no Figshare, Elsevier Pure, Symplectic, Ex Libris or
  Dataverse tenancy that could be found: unlike most of this cohort, there is no vendor contract
  masquerading as this institution's engineering. Tsinghua research groups (THUDM, THUNLP, THUML,
  TUNA) publish substantial open-source code on GitHub, but those are project repositories, not an
  institutional API programme, and they are recorded as pointers rather than as surfaces.

  detail: >-
    Fully probed on 2026-08-19 and correctly thin. Three institution-operated, unauthenticated,
    machine-readable surfaces were verified live and are the whole public footprint: the TUNA
    mirror's tunasync status document, the TUNA mirror's installable-image catalog, and the
    Shibboleth IdP's SAML 2.0 federation metadata. A fourth institution-operated surface, the
    library's DataCite DOI service, is registered and real (194 DOIs, prefix 10.23650) but its
    resolution host returns no HTTP response from outside China. Everything else Tsinghua runs is
    behind one campus identity service (id.tsinghua.edu.cn): learning platform, course
    registration, GitLab, cloud storage, information portal, campus card. There is no developer
    portal, no open data portal, no API key issuance, no robots.txt and no llms.txt; a
    negative-probe pass confirmed api., open., data., oai., opendata. and dataverse.
    tsinghua.edu.cn do not resolve, and that the hosts which do resolve are not a wildcard (two
    nonsense subdomains returned NXDOMAIN). No OAI-PMH endpoint was found and re3data lists no
    Tsinghua repository. Notably, and unlike most of this cohort, NO vendor tenancy was found at
    all — no Figshare, Pure, Symplectic, Ex Libris or Dataverse — so there was no vendor contract
    to strip and none to record. The low score is the correct measurement of a large research
    university that runs its systems for its own community and publishes almost nothing outward.

- aid: tsinghua:gitlab
  name: Tsinghua University GitLab
  description: >-
    Tsinghua runs its own GitLab instance at git.tsinghua.edu.cn, on its own registrable domain
    and behind its own identity service — the sign-in page's only form posts to /users/auth/thuid.
    GitLab exposes a substantial REST and GraphQL API, but this deployment gates all of it behind
    THU ID authentication, publishes no public projects to an anonymous visitor, and offers no
    outside credentialing path. It is recorded as a surface because it is a genuine
    institution-operated developer platform, and no contract is saved under it because the API
    contract is GitLab's product API, identical across every GitLab installation, and would credit
    Tsinghua with GitLab's engineering.

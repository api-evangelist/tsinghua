  - date: '2026-08-19'
    rating: 3
    summary: >-
      University-pipeline re-profile with the operator axis applied. The June pass was
      directionally right — no developer portal, everything behind campus SSO — but it under-read
      the footprint on three counts, and this pass corrects all three. First, the ISO image
      catalog it recorded as a 404 is live at the correct path, /static/status/isoinfo.json
      (HTTP 200, 461KB, 67 entries) rather than /status/isoinfo.json. Second, Tsinghua runs its
      own Shibboleth Identity Provider and publishes SAML 2.0 federation metadata at
      idp.tsinghua.edu.cn/idp/shibboleth (HTTP 200, 14,622 bytes, entityID
      https://idp.tsinghua.edu.cn/idp/shibboleth, shibmd:Scope tsinghua.edu.cn) with every SSO
      and SLO location on a Tsinghua host — an institution-operated identity federation surface
      that was not catalogued at all. Third, the university library holds a DataCite direct
      membership in its own name (symbol TSINGHUA, joined 2016) with 194 DOIs on prefix 10.23650,
      and two Tsinghua academic units hold their own Crossref memberships. Also newly recorded:
      the mirror edge serves 403 to browser User-Agents and 200 to plain tool User-Agents, the
      inverse of a normal bot filter; and the DOI resolution host datacite.lib.tsinghua.edu.cn
      completes TCP and TLS but returns zero bytes to an HTTP GET after 60 seconds from outside
      China. No vendor tenancy of any kind was found — no Figshare, Pure, Symplectic, Ex Libris
      or Dataverse — so unlike most of this cohort there was no misattributed vendor contract to
      remove. All four apis[] entries are x-operator institution. No endpoints were fabricated.
    endpoints:

description: 'Tsinghua University is a non-commercial public higher-education institution; nothing it
  exposes is sold as a product. The three publicly reachable machine-readable surfaces verified on 2026-08-19
  — the TUNA mirror''s sync-status and installable-image documents, and the Shibboleth IdP''s SAML 2.0
  federation metadata — are free, unauthenticated, and carry no plan, quota, signup or terms of use of
  any kind. Everything else the university runs is not priced but gated: access is granted by institutional
  affiliation through id.tsinghua.edu.cn, not by purchase. No developer portal, no API key issuance and
  no commercial API terms were found.'
notes: Corrected 2026-08-19. The June 2026 version of this file described free "library, repository, course,
  and open-metadata interfaces"; no such public interfaces were found on any Tsinghua host in a full probe
  pass. "Free / Open" here means exactly three unauthenticated endpoints; "Affiliation / Credentialed"
  means campus SSO, which is not a plan tier.

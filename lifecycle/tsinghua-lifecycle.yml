name: Tsinghua University — API lifecycle posture
description: >-
  Versioning, change communication and deprecation posture across Tsinghua University's
  publicly reachable machine-readable surfaces. The finding is uniform: none of them versions,
  announces or deprecates anything in a machine-readable way, and none of them is presented by
  the institution as an API with a contract to keep.
generated: '2026-08-19'
modified: '2026-08-19'
method: probed
source: live probes and the artifacts in openapi/_original/, 2026-08-19
x-operator: institution
surfaces:
  - name: Tsinghua University TUNA Mirror Status API
    path_versioning: false
    header_versioning: false
    published_changelog: false
    deprecation_policy: none
    status_page: false
    detail: >-
      A static JSON document served from /static/. There is no version segment in the path, no
      version field in the payload, and no announcement channel. Its shape is set by the tunasync
      software (github.com/tuna/tunasync, MIT) rather than by a published contract, so the
      practical change signal for a consumer is the upstream project's release history, not
      anything Tsinghua publishes.
    change_signal: https://github.com/tuna/tunasync
  - name: Tsinghua University TUNA Mirror ISO Image Catalog API
    path_versioning: false
    header_versioning: false
    published_changelog: false
    deprecation_policy: none
    detail: >-
      Same posture as the status endpoint, on the same host, generated by the same site tooling
      (github.com/tuna/mirror-web). Its contents change whenever a mirrored distribution cuts a
      release; the document itself carries no timestamp or version marker at all, which is a
      weaker signal than the status endpoint's per-mirror timestamps.
    change_signal: https://github.com/tuna/mirror-web
  - name: Tsinghua University Identity Provider — SAML 2.0 federation metadata
    path_versioning: false
    header_versioning: false
    published_changelog: false
    deprecation_policy: none
    detail: >-
      SAML metadata carries its own lifecycle conventions — validUntil and cacheDuration
      attributes, and a signature — which are how relying parties are meant to know when to
      refetch. Tsinghua's document as served on 2026-08-19 carries neither validUntil nor
      cacheDuration and is not XML-signed, so a relying party has no published refresh interval
      and no way to detect tampering from the document alone. The Shibboleth boilerplate comment
      the endpoint emits says as much: "This metadata is not dynamic - it will not change as your
      configuration changes."
    gap: no validUntil, no cacheDuration, no XML signature
retirement_watch:
  - host: datacite.lib.tsinghua.edu.cn
    verdict: unreadable
    checked: '2026-08-19'
    detail: >-
      Not retired and not claimed as retired — TCP and TLS both succeed. HTTP returns nothing
      after 60 seconds from this vantage point, which may be a geographic filter rather than a
      failure. Re-probe before drawing any conclusion; 194 live DataCite DOIs depend on it.

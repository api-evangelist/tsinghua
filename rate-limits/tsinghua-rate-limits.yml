description: 'Tsinghua University publishes no rate-limit documentation of any kind, and none of its three
  publicly reachable machine-readable endpoints returned a rate-limit header, a Retry-After, or a 429
  in a full probe pass on 2026-08-19. The one throttle-shaped behaviour observed is not a rate limit at
  all: the TUNA mirror edge answers HTTP 403 with an HTML denial page to requests carrying a desktop-browser
  User-Agent, while answering the identical request 200 for a plain tool User-Agent. Callers should still
  harvest politely — the mirror is a shared community resource and the ISO catalog response alone is 461KB.'
notes: Corrected 2026-08-19. The June 2026 version of this file described throttling on "OAI-PMH, IIIF,
  library" harvesting endpoints; no such endpoints exist on any Tsinghua host. No 429 was observed and
  no rate-limit header is published.
